<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>Siempre Kiara</title>
<meta name="description" content="Su vida fue un regalo, su amor una huella y su recuerdo permanecerá para siempre." />
<meta name="theme-color" content="#15141b" />

<!-- Vista previa al compartir por WhatsApp, Telegram o redes -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Siempre Kiara" />
<meta property="og:description" content="Su vida fue un regalo, su amor una huella y su recuerdo permanecerá para siempre." />
<meta property="og:image" content="KIARA_PORTADA.jpg" />
<meta property="og:locale" content="es_ES" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Lora:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">

<style>
    /* ============================================================
       PALETA Y VARIABLES
       Cambia aquí los colores y afectará a toda la página.
       ============================================================ */
    :root {
        --noche:      #15141b;   /* fondo profundo, índigo casi negro */
        --penumbra:   #211f2a;   /* superficies elevadas */
        --vela:       #e8b771;   /* luz de vela, color principal */
        --vela-suave: #f4d6a8;   /* brillo de la llama */
        --lino:       #f2ece3;   /* texto principal */
        --ceniza:     #a9a0a6;   /* texto secundario */

        --ancho-max:  980px;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        background: var(--noche);
        color: var(--lino);
        font-family: 'Lora', Georgia, 'Times New Roman', serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       CAPAS DE FONDO
       ============================================================ */

    /* Imagen de flores, muy tenue y bajo un velo oscuro */
    .fondo-flores {
        position: fixed;
        inset: 0;
        background-image: url('FOTO_FONDO_FLORES.png');
        background-size: cover;
        background-position: center;
        opacity: 0.18;
        filter: saturate(0.6) brightness(0.7);
        z-index: -3;
    }

    /* Velo que oscurece los bordes y mantiene el texto legible */
    .velo {
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse at 50% 35%, rgba(232,183,113,0.10) 0%, transparent 60%),
            radial-gradient(ellipse at 50% 50%, rgba(21,20,27,0.55) 0%, rgba(21,20,27,0.94) 75%);
        z-index: -2;
    }

    /* Partículas de luz. Sustituyen al GIF de brillos:
       pesan cero, no gastan datos y consumen mucha menos batería. */
    .motas {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: -1;
    }
    .mota {
        position: absolute;
        bottom: -12px;
        border-radius: 50%;
        background: var(--vela-suave);
        opacity: 0;
        animation: subir linear infinite;
    }
    @keyframes subir {
        0%   { transform: translateY(0) translateX(0); opacity: 0; }
        12%  { opacity: 0.55; }
        88%  { opacity: 0.35; }
        100% { transform: translateY(-108vh) translateX(28px); opacity: 0; }
    }

    /* ============================================================
       PANTALLA DE ENTRADA
       El navegador exige un gesto del usuario para reproducir audio.
       Aquí ese gesto es encender la vela.
       ============================================================ */
    .entrada {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 24px;
        background: var(--noche);
        transition: opacity 1.1s ease, visibility 1.1s ease;
    }
    .entrada.oculta {
        opacity: 0;
        visibility: hidden;
    }

    .entrada-nombre {
        font-family: 'Marcellus', Georgia, serif;
        font-size: clamp(28px, 7vw, 44px);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--vela);
        margin: 0;
        text-indent: 0.22em; /* compensa el espaciado de la última letra */
    }

    .boton-vela {
        appearance: none;
        border: 0;
        background: transparent;
        cursor: pointer;
        padding: 18px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        transition: transform 0.4s ease;
    }
    .boton-vela:hover { transform: scale(1.06); }
    .boton-vela:focus-visible {
        outline: 2px solid var(--vela);
        outline-offset: 6px;
    }

    /* La llama, dibujada solo con CSS */
    .llama {
        width: 26px;
        height: 42px;
        background: radial-gradient(ellipse at 50% 75%, #fff6e0 0%, var(--vela-suave) 35%, var(--vela) 62%, rgba(232,183,113,0) 78%);
        border-radius: 50% 50% 45% 45% / 68% 68% 32% 32%;
        filter: blur(0.4px);
        box-shadow: 0 0 34px 14px rgba(232,183,113,0.32);
        animation: titilar 2.6s ease-in-out infinite;
        transform-origin: 50% 90%;
    }
    @keyframes titilar {
        0%, 100% { transform: scaleY(1)    scaleX(1)    rotate(-1deg); opacity: 0.92; }
        35%      { transform: scaleY(1.09) scaleX(0.95) rotate(1.5deg); opacity: 1; }
        70%      { transform: scaleY(0.96) scaleX(1.03) rotate(-0.5deg); opacity: 0.88; }
    }

    .entrada-instruccion {
        font-size: clamp(14px, 3.6vw, 17px);
        font-style: italic;
        color: var(--ceniza);
        margin: 0;
        max-width: 30ch;
        line-height: 1.6;
    }

    /* ============================================================
       CONTENIDO
       ============================================================ */
    .pagina {
        position: relative;
        max-width: var(--ancho-max);
        margin: 0 auto;
        padding: clamp(48px, 9vh, 90px) clamp(18px, 5vw, 40px) clamp(60px, 10vh, 100px);
        text-align: center;
    }

    /* Aparición escalonada al entrar */
    .revelar {
        opacity: 0;
        transform: translateY(18px);
        transition: opacity 1.2s ease, transform 1.2s ease;
    }
    body.abierto .revelar {
        opacity: 1;
        transform: none;
    }
    body.abierto .revelar:nth-of-type(1) { transition-delay: 0.15s; }
    body.abierto .revelar:nth-of-type(2) { transition-delay: 0.45s; }
    body.abierto .revelar:nth-of-type(3) { transition-delay: 0.75s; }
    body.abierto .revelar:nth-of-type(4) { transition-delay: 1.05s; }

    .titulo {
        font-family: 'Marcellus', Georgia, serif;
        font-size: clamp(38px, 11vw, 78px);
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: 0.06em;
        color: var(--vela);
        margin: 0 0 22px;
        text-shadow: 0 0 42px rgba(232,183,113,0.28);
    }

    .subtitulo {
        font-size: clamp(16px, 4.2vw, 21px);
        font-style: italic;
        line-height: 1.75;
        color: var(--lino);
        opacity: 0.9;
        max-width: 34ch;
        margin: 0 auto;
    }

    /* Separador con la huella: el signo propio de Kiara */
    .separador {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin: clamp(34px, 6vh, 52px) auto;
        max-width: 340px;
    }
    .separador span {
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(232,183,113,0.55), transparent);
    }
    .separador svg {
        width: 26px;
        height: 26px;
        fill: var(--vela);
        opacity: 0.85;
        flex-shrink: 0;
    }

    /* ---------- Vídeo ---------- */
    .marco-video {
        position: relative;
        margin: 0 auto;
        border-radius: 14px;
        padding: 10px;
        background: linear-gradient(160deg, rgba(232,183,113,0.55), rgba(232,183,113,0.12) 45%, rgba(232,183,113,0.4));
        box-shadow: 0 24px 60px rgba(0,0,0,0.55);
    }

    /* Halo de luz de vela que respira detrás del vídeo */
    .marco-video::before {
        content: "";
        position: absolute;
        inset: -14%;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(232,183,113,0.22) 0%, transparent 68%);
        filter: blur(28px);
        z-index: -1;
        animation: respirar 7s ease-in-out infinite;
    }
    @keyframes respirar {
        0%, 100% { opacity: 0.55; transform: scale(0.97); }
        50%      { opacity: 1;    transform: scale(1.04); }
    }

    video {
        display: block;
        width: 100%;
        max-height: 74vh;          /* evita que un vídeo vertical ocupe toda la pantalla */
        object-fit: contain;        /* funciona igual en vídeo horizontal y vertical */
        background: #000;
        border-radius: 8px;
    }

    .pie {
        font-size: clamp(15px, 3.9vw, 19px);
        font-style: italic;
        line-height: 1.75;
        color: var(--ceniza);
        max-width: 40ch;
        margin: clamp(34px, 6vh, 52px) auto 0;
    }

    /* ---------- Control de música ---------- */
    .control-musica {
        position: fixed;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 50;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 1px solid rgba(232,183,113,0.4);
        background: rgba(33,31,42,0.85);
        backdrop-filter: blur(6px);
        color: var(--vela);
        cursor: pointer;
        display: none;              /* se muestra al entrar */
        place-items: center;
        transition: opacity 0.4s ease, transform 0.2s ease;
    }
    body.abierto .control-musica { display: grid; }
    .control-musica:hover { transform: scale(1.08); }
    .control-musica:focus-visible {
        outline: 2px solid var(--vela);
        outline-offset: 3px;
    }
    .control-musica svg { width: 20px; height: 20px; fill: currentColor; }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 640px) {
        .marco-video { padding: 7px; border-radius: 11px; }
        video { max-height: 68vh; }
        .titulo { letter-spacing: 0.03em; }
    }

    /* Móvil en horizontal: apuramos el alto disponible */
    @media (max-height: 520px) and (orientation: landscape) {
        .pagina { padding-top: 28px; padding-bottom: 36px; }
        .separador { margin: 20px auto; }
        video { max-height: 78vh; }
    }

    @media (min-width: 1100px) {
        video { max-height: 70vh; }
    }

    /* Respeta a quien tenga reducido el movimiento en su sistema */
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
        }
        .revelar { opacity: 1; transform: none; }
        .motas { display: none; }
    }
</style>
</head>

<body>

<div class="fondo-flores"></div>
<div class="velo"></div>
<div class="motas" id="motas" aria-hidden="true"></div>

<!-- Pantalla de entrada: el toque en la vela desbloquea el audio -->
<div class="entrada" id="entrada">
    <p class="entrada-nombre">Kiara</p>
    <button class="boton-vela" id="botonEntrar" aria-label="Encender la vela y entrar">
        <span class="llama" aria-hidden="true"></span>
    </button>
    <p class="entrada-instruccion">Enciende la vela para entrar</p>
</div>

<!-- Música de fondo -->
<audio id="musica" loop preload="auto">
    <source src="MUSICA.mp3" type="audio/mpeg">
</audio>

<main class="pagina">

    <h1 class="titulo revelar">Siempre Kiara</h1>

    <p class="subtitulo revelar">Su vida fue un regalo, su amor una huella y su recuerdo permanecerá para siempre.</p>

    <div class="separador revelar" aria-hidden="true">
        <span></span>
        <svg viewBox="0 0 64 64"><ellipse cx="20" cy="20" rx="7" ry="9"/><ellipse cx="34" cy="15" rx="7" ry="9.5"/><ellipse cx="48" cy="21" rx="6.5" ry="8.5"/><path d="M34 30c8 0 15 6 15 13 0 6-5 9-10 8l-5-1-5 1c-5 1-10-2-10-8 0-7 7-13 15-13z"/></svg>
        <span></span>
    </div>

    <div class="marco-video revelar">
        <video id="video" autoplay muted loop playsinline preload="auto" poster="KIARA_PORTADA.jpg">
            <source src="VIDEO.mp4" type="video/mp4">
        </video>
    </div>

    <p class="pie">Gracias por compartir con Kiara una historia de amor que el tiempo nunca podrá borrar.</p>

</main>

<!-- Control de música -->
<button class="control-musica" id="botonMusica" aria-label="Silenciar la música">
    <svg id="iconoAltavoz" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2v2a8 8 0 0 1 0 16v2a10 10 0 0 0 0-20z"/></svg>
</button>

<script>
(function () {
    'use strict';

    var entrada   = document.getElementById('entrada');
    var boton     = document.getElementById('botonEntrar');
    var musica    = document.getElementById('musica');
    var video     = document.getElementById('video');
    var btnMusica = document.getElementById('botonMusica');
    var icono     = document.getElementById('iconoAltavoz');

    var ICONO_SONANDO  = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2v2a8 8 0 0 1 0 16v2a10 10 0 0 0 0-20z';
    var ICONO_SILENCIO = 'M3 9v6h4l5 5V4L7 9H3zm18.5-.9L20.1 6.7 17.8 9l-2.3-2.3-1.4 1.4L16.4 10.4l-2.3 2.3 1.4 1.4 2.3-2.3 2.3 2.3 1.4-1.4-2.3-2.3 2.3-2.3z';

    /* --- Partículas de luz --- */
    var contenedorMotas = document.getElementById('motas');
    var reducirMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reducirMovimiento && contenedorMotas) {
        for (var i = 0; i < 16; i++) {
            var mota = document.createElement('div');
            var tam = (Math.random() * 2.4 + 1.2).toFixed(1);
            mota.className = 'mota';
            mota.style.left = (Math.random() * 100).toFixed(2) + '%';
            mota.style.width = tam + 'px';
            mota.style.height = tam + 'px';
            mota.style.animationDuration = (Math.random() * 14 + 16).toFixed(1) + 's';
            mota.style.animationDelay = (Math.random() * -28).toFixed(1) + 's';
            contenedorMotas.appendChild(mota);
        }
    }

    /* --- El vídeo arranca solo, silenciado y en bucle.
           Silenciado es la única forma de que los navegadores lo permitan. --- */
    function reproducirVideo() {
        var p = video.play();
        if (p && p.catch) { p.catch(function () { /* si falla, quedan los controles del gesto de entrada */ }); }
    }
    reproducirVideo();

    /* --- Entrar: aquí es donde se desbloquea el audio --- */
    function entrar() {
        document.body.classList.add('abierto');
        entrada.classList.add('oculta');
        reproducirVideo();

        musica.volume = 0;
        var p = musica.play();
        if (p && p.catch) { p.catch(function () { actualizarIcono(true); }); }

        // Subida suave del volumen para no romper el silencio de golpe
        var objetivo = 0.65, paso = 0.02;
        var subir = setInterval(function () {
            musica.volume = Math.min(objetivo, musica.volume + paso);
            if (musica.volume >= objetivo) { clearInterval(subir); }
        }, 80);

        setTimeout(function () { entrada.style.display = 'none'; }, 1200);
    }

    boton.addEventListener('click', entrar);

    /* --- Silenciar / activar música --- */
    function actualizarIcono(silenciada) {
        icono.firstElementChild.setAttribute('d', silenciada ? ICONO_SILENCIO : ICONO_SONANDO);
        btnMusica.setAttribute('aria-label', silenciada ? 'Activar la música' : 'Silenciar la música');
    }

    btnMusica.addEventListener('click', function () {
        if (musica.paused || musica.muted) {
            musica.muted = false;
            musica.play();
            actualizarIcono(false);
        } else {
            musica.muted = true;
            actualizarIcono(true);
        }
    });

    /* --- Al volver a la pestaña, retomar la reproducción --- */
    document.addEventListener('visibilitychange', function () {
        if (!document.hidden && document.body.classList.contains('abierto')) {
            reproducirVideo();
            if (!musica.muted) { musica.play().catch(function () {}); }
        }
    });
})();
</script>

</body>
</html>
